apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: perses-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-user>/perses-gitops-workflow.git
    targetRevision: main
    path: manifests/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: perses-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
