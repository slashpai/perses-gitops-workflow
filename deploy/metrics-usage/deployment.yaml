apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-usage-config
  namespace: perses-dev
data:
  config.yaml: |
    metric_collector:
      enable: true
      period: "1d"
      http_client:
        url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
    labels_collectors:
      - enable: true
        period: "1d"
        concurrency: 5
        prometheus_client:
          url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
    perses_collector:
      enable: true
      period: "1d"
      perses_client:
        url: "http://perses-sample.perses-dev.svc.cluster.local:8080"
    # rules_collectors not enabled — this repo deploys dashboards only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-usage
  namespace: perses-dev
  labels:
    app.kubernetes.io/name: metrics-usage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-usage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-usage
    spec:
      containers:
        - name: metrics-usage
          image: persesdev/metrics-usage:latest
          args:
            - "--config=/etc/metrics-usage/config.yaml"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/metrics-usage
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: metrics-usage-config
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-usage
  namespace: perses-dev
  labels:
    app.kubernetes.io/name: metrics-usage
spec:
  selector:
    app.kubernetes.io/name: metrics-usage
  ports:
    - port: 8080
      targetPort: http
      name: http
