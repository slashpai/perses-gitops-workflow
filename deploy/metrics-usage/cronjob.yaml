# Scheduled Day-2 audit — same logic as audit-job.yaml, no long-lived Deployment.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: metrics-usage-audit
  namespace: perses-dev
  labels:
    app.kubernetes.io/name: metrics-usage-audit
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: metrics-usage-audit
        spec:
          restartPolicy: Never
          containers:
            - name: metrics-usage
              image: persesdev/metrics-usage:latest
              args:
                - "--config=/etc/metrics-usage/config.yaml"
              ports:
                - containerPort: 8080
                  name: http
              volumeMounts:
                - name: config
                  mountPath: /etc/metrics-usage
                  readOnly: true
            - name: audit
              image: curlimages/curl:latest
              env:
                - name: METRICS_USAGE_URL
                  value: "http://localhost:8080"
                - name: MAX_RETRIES
                  value: "30"
                - name: RETRY_INTERVAL
                  value: "10"
                - name: HOLD_SECONDS
                  value: "0"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  ATTEMPT=0
                  while [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; do
                    ATTEMPT=$((ATTEMPT + 1))
                    if curl -sf "${METRICS_USAGE_URL}/api/v1/metrics" >/dev/null 2>&1; then
                      break
                    fi
                    echo "Waiting for metrics-usage API (${ATTEMPT}/${MAX_RETRIES})..."
                    sleep "$RETRY_INTERVAL"
                  done
                  if [ "$ATTEMPT" -ge "$MAX_RETRIES" ]; then
                    echo "FAIL: metrics-usage API unreachable"
                    exit 1
                  fi

                  PENDING=$(curl -sf "${METRICS_USAGE_URL}/api/v1/pending_usages")
                  if [ "$PENDING" = "{}" ]; then
                    echo "OK: All dashboard metrics exist in Prometheus"
                    exit 0
                  fi

                  echo "FAIL: Dashboards reference metrics not found in Prometheus:"
                  echo "$PENDING"
                  exit 1
          volumes:
            - name: config
              configMap:
                name: metrics-usage-config
