# Minimal kube-prometheus-stack for this Perses demo.
# Installs: prometheus-operator, Prometheus, Alertmanager, node-exporter.
# Skips: Grafana (Perses is the UI), kube-state-metrics, control-plane scrapes.

grafana:
  enabled: false

kubeStateMetrics:
  enabled: false

kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

windowsMonitoring:
  enabled: false

thanosRuler:
  enabled: false

defaultRules:
  create: false

prometheusOperator:
  enabled: true

prometheus:
  enabled: true

alertmanager:
  enabled: true

nodeExporter:
  enabled: true
