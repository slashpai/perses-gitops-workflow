name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: dashboards/go.mod
          cache-dependency-path: dashboards/go.sum

      - name: Validate PromQL and dashboard build
        run: make validate

      - name: Render PersesDashboard manifests
        run: make render

      - name: Fail if committed manifests drift from render
        run: git diff --exit-code manifests/dashboards/
