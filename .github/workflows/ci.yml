name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: dashboards/go.sum

      - name: Validate PromQL and dashboard build
        run: make validate

      - name: Render PersesDashboard manifests
        run: make render PROJECT=monitoring DATASOURCE=prometheus

      - name: Fail if committed manifests drift from render
        run: git diff --exit-code manifests/dashboards/
