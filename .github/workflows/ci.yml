name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: dashboards/go.mod
          cache-dependency-path: dashboards/go.sum

      - name: Validate and render dashboards
        run: make render-dashboards

      - name: Fail if manifests drift
        run: git diff --exit-code manifests/dashboards/
