apiVersion: batch/v1
kind: Job
metadata:
  name: check-dashboard-metrics
  namespace: perses-dev
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: check-dashboard-metrics
    spec:
      containers:
        - name: check
          image: curlimages/curl:latest
          env:
            - name: MAX_RETRIES
              value: "5"
            - name: RETRY_INTERVAL
              value: "10"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ATTEMPT=0
              while [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; do
                ATTEMPT=$((ATTEMPT + 1))
                echo "Attempt ${ATTEMPT}/${MAX_RETRIES}: checking metrics-usage..."

                PENDING=$(curl -sf http://metrics-usage.perses-dev:8080/api/v1/pending_usages 2>/dev/null) || {
                  echo "  Could not reach metrics-usage API"
                  if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
                    echo "  Retrying in ${RETRY_INTERVAL}s..."
                    sleep "$RETRY_INTERVAL"
                    continue
                  fi
                  echo "FAIL: metrics-usage API unreachable after ${MAX_RETRIES} attempts"
                  exit 1
                }

                if [ "$PENDING" = "{}" ]; then
                  echo "OK: All dashboard metrics exist in Prometheus"

                  echo "Checking labels collection status..."
                  METRICS=$(curl -sf "http://metrics-usage.perses-dev:8080/api/v1/metrics?used=true" 2>/dev/null) || {
                    echo "WARN: Could not fetch metrics with labels (labels check skipped)"
                    exit 0
                  }
                  NO_LABELS=$(echo "$METRICS" | sed -n 's/.*"\([^"]*\)":{[^}]*"labels":\[\]/\1/p')
                  if [ -n "$NO_LABELS" ]; then
                    echo "WARN: Some used metrics have no labels collected yet:"
                    echo "  $NO_LABELS"
                    echo "  (labels_collector may still be running — run 'make check-labels' locally for full validation)"
                  else
                    echo "OK: All used metrics have labels collected"
                  fi
                  exit 0
                fi

                echo "  Dashboards reference metrics not found in Prometheus:"
                echo "$PENDING"
                if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
                  echo "  Retrying in ${RETRY_INTERVAL}s (collectors may still be running)..."
                  sleep "$RETRY_INTERVAL"
                  continue
                fi
              done

              echo "FAIL: Unresolved metric references after ${MAX_RETRIES} attempts"
              exit 1
      restartPolicy: Never
