apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: node-exporter-overview
    app.kubernetes.io/managed-by: perses-gitops-workflow
    app.kubernetes.io/name: perses-dashboard
    app.kubernetes.io/part-of: perses-operator
  name: node-exporter-overview
  namespace: perses-dev
spec:
  config:
    display:
      name: Node Exporter / Overview
    duration: 1h
    layouts:
    - kind: Grid
      spec:
        display:
          title: CPU (community-mixins)
        items:
        - content:
            $ref: '#/spec/panels/0_0'
          height: 8
          width: 12
          x: 0
          "y": 0
        - content:
            $ref: '#/spec/panels/0_1'
          height: 8
          width: 12
          x: 12
          "y": 0
    - kind: Grid
      spec:
        display:
          title: Memory (community-mixins)
        items:
        - content:
            $ref: '#/spec/panels/1_0'
          height: 8
          width: 12
          x: 0
          "y": 0
        - content:
            $ref: '#/spec/panels/1_1'
          height: 8
          width: 12
          x: 12
          "y": 0
    - kind: Grid
      spec:
        display:
          title: Filesystem (custom)
        items:
        - content:
            $ref: '#/spec/panels/2_0'
          height: 8
          width: 24
          x: 0
          "y": 0
    panels:
      "0_0":
        kind: Panel
        spec:
          display:
            description: Shows CPU utilization percentage across cluster nodes
            name: CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last
              yAxis:
                format:
                  unit: percent-decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        1
                      -
                        sum without (mode) (
                          rate(
                            node_cpu_seconds_total{instance=~"$instance",job="node-exporter",mode=~"idle|iowait|steal"}[$__rate_interval]
                          )
                        )
                    / ignoring (cpu) group_left ()
                      count without (cpu, mode) (
                        node_cpu_seconds_total{instance=~"$instance",job="node-exporter",mode="idle"}
                      )
                  seriesNameFormat: '{{device}} - CPU - Usage'
      "0_1":
        kind: Panel
        spec:
          display:
            description: Shows CPU utilization metrics
            name: CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: node_load1{instance=~"$instance",job="node-exporter"}
                  seriesNameFormat: CPU - 1m Average
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: node_load5{instance=~"$instance",job="node-exporter"}
                  seriesNameFormat: CPU - 5m Average
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: node_load15{instance=~"$instance",job="node-exporter"}
                  seriesNameFormat: CPU - 15m Average
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: count(node_cpu_seconds_total{instance=~"$instance",job="node-exporter",mode="idle"})
                  seriesNameFormat: CPU - Logical Cores
      "1_0":
        kind: Panel
        spec:
          display:
            description: Shows memory utilization metrics
            name: Memory Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last
              yAxis:
                format:
                  shortValues: true
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: node_memory_Buffers_bytes{instance=~"$instance",job="node-exporter"}
                  seriesNameFormat: Memory - Buffers
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: node_memory_Cached_bytes{instance=~"$instance",job="node-exporter"}
                  seriesNameFormat: Memory - Cached
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: node_memory_MemFree_bytes{instance=~"$instance",job="node-exporter"}
                  seriesNameFormat: Memory - Free
      "1_1":
        kind: Panel
        spec:
          display:
            description: Shows memory utilization across nodes
            name: Memory Usage
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percent
              thresholds:
                defaultColor: green
                mode: absolute
                steps:
                - color: orange
                  value: 80
                - color: red
                  value: 90
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                      100
                    -
                        avg(node_memory_MemAvailable_bytes{instance=~"$instance",job="node-exporter"})
                      /
                        avg(node_memory_MemTotal_bytes{instance=~"$instance",job="node-exporter"}) * 100
                  seriesNameFormat: Memory - Usage
      "2_0":
        kind: Panel
        spec:
          display:
            description: Custom panel — filesystem used ratio from local promql package.
            name: Filesystem Used
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              yAxis:
                format:
                  unit: percent-decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        node_filesystem_size_bytes{fstype!="",instance=~"$instance",job="node-exporter",mountpoint!=""}
                      -
                        node_filesystem_avail_bytes{fstype!="",instance=~"$instance",job="node-exporter",mountpoint!=""}
                    /
                      node_filesystem_size_bytes{fstype!="",instance=~"$instance",job="node-exporter",mountpoint!=""}
                  seriesNameFormat: '{{instance}} - {{mountpoint}}'
    variables:
    - kind: ListVariable
      spec:
        allowAllValue: true
        allowMultiple: false
        display:
          hidden: false
          name: instance
        name: instance
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: prometheus-datasource
            labelName: instance
            matchers:
            - node_uname_info{job="node-exporter",sysname!="Darwin"}
status: {}
